<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>English Vocabulary Check</title></head>
<body>
<h1>English Vocabulary Check</h1>
<p>{{ msg }}</p>
{% for message in get_flashed_messages() %}<p role="alert">{{ message }}</p>{% endfor %}
<nav>
  <a href="{{ url_for('upload') }}">Upload vocabulary</a> |
  <a href="{{ url_for('refresh') }}">Refresh</a> |
  <a href="{{ url_for('quiz') }}">Vocabulary quiz</a> |
  <a href="{{ url_for('spell') }}">Spelling quiz</a> |
  <a href="{{ url_for('misspelled') }}">Confused words</a>
</nav>
<form method="post" action="{{ url_for('logout') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit">Log out</button>
</form>
</body></html>
