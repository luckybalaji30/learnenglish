<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vocabulary quiz</title></head>
<body>
<h1>Vocabulary quiz</h1>
<form method="post" action="{{ url_for('quiz_answers') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <ol>{% for word, options in q.items() %}
    <li><fieldset><legend>What is the meaning of {{ word }}?</legend>
      {% for option in options %}<label><input type="radio" name="{{ word }}" value="{{ option }}" required>{{ option }}</label>{% endfor %}
    </fieldset></li>
  {% endfor %}</ol>
  <button type="submit">Submit answers</button>
</form>
</body></html>
