<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spelling quiz</title></head>
<body>
<h1>Spelling quiz</h1>
<form method="post" action="{{ url_for('spell_answers') }}" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <ol>{% for word, masked in q.items() %}
    <li><label>Complete {{ masked }} ({{ a[word] }})
      <input type="text" name="{{ word }}" required autocomplete="off">
    </label></li>
  {% endfor %}</ol>
  <button type="submit">Submit answers</button>
</form>
</body></html>
