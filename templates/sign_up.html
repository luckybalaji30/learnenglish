<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign up</title></head>
<body>
<h1>Create account</h1>
{% for message in get_flashed_messages() %}<p role="alert">{{ message }}</p>{% endfor %}
<form method="post" action="{{ url_for('register') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username <input name="username" minlength="3" maxlength="50" required autocomplete="username"></label>
  <label>Password (minimum 12 characters) <input type="password" name="password" minlength="12" required autocomplete="new-password"></label>
  <button type="submit">Register</button>
</form>
<a href="{{ url_for('login') }}">Log in</a>
</body></html>
